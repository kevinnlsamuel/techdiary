name: "build and publish jekyll site"
on:
  push:
  workflow_call:
jobs:
  buildandpublish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          destination: './_site/techdiary'
        env:
          TZ: Asia/Kolkata
      - name: setup redirect
        working-directory: /home/runner/work/techdiary/techdiary
        run: |
          cp redirect.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v5
