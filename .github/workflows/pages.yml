name: "build and publish jekyll site"
on:
  push:
  workflow_call:
jobs:
  buildandpublish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          destination: './_site/techdiary'
        env:
          TZ: Asia/Kolkata
      - run: |
          cat << EOM > ./_site/index.html
          <!doctype html><html><head><meta http-equiv="refresh" content="/techdiary/" /></head></html>
          EOM
        name: http refresh

      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v5
